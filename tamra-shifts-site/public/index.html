<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>לוח משמרות תמרה</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Makes the site installable as an app on the phone's home screen (Android "add to home
     screen" / install prompt, and iOS "Add to Home Screen"), so employees get an app icon and
     a full-screen window instead of a browser tab + bookmark. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#D9772B">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תמרה משמרות">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app"></div>
<div class="toastzone" id="toastzone"></div>
<script src="/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js'); });
}
</script>
</body>
</html>
